[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biolab-copilot"
version = "0.1.0"
description = "A local-first, traceable foundation for biological experiment data analysis."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "BioLab Copilot contributors" }]
dependencies = [
    "numpy>=2.0,<3",
    "openpyxl>=3.1,<4",
    "pydantic>=2.6,<3",
    "scipy>=1.16,<2",
    "matplotlib>=3.8,<4",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8,<2",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
templates = [
    "openpyxl>=3.1,<4",
]

[project.scripts]
biolab-copilot = "biolab_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "scipy", "scipy.*"]
# These scientific/boundary packages have no installed type stubs in the offline runtime.
# The project code remains typed at the package boundary.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["docx", "docx.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true
